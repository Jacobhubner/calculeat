<svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="leafGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#25BD00;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#D4C71A;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FB923C;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Left leaf (green) -->
  <g transform="translate(15, 30)">
    <path d="M 20 40 Q 15 20 28 8 Q 35 20 38 35 Q 35 42 20 40 Z" fill="#25BD00" opacity="0.95"/>
    <path d="M 23 12 Q 32 28 28 38" stroke="white" stroke-width="0.8" fill="none" opacity="0.5"/>
  </g>

  <!-- Right leaf (gradient) -->
  <g transform="translate(35, 30)">
    <path d="M 50 40 Q 55 20 42 8 Q 35 20 32 35 Q 35 42 50 40 Z" fill="url(#leafGradient)" opacity="0.95"/>
    <path d="M 45 12 Q 36 28 42 38" stroke="white" stroke-width="0.8" fill="none" opacity="0.5"/>
  </g>

  <!-- Stem -->
  <line x1="35" y1="8" x2="35" y2="42" stroke="#2D5016" stroke-width="1.8" stroke-linecap="round"/>

  <!-- "Calculeat" Text -->
  <!-- "Calcul" in dark -->
  <text x="75" y="65" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="700" letter-spacing="-0.5" fill="#1F2937">Calcul</text>

  <!-- "eat" in gradient -->
  <text x="305" y="65" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="48" font-weight="700" letter-spacing="-0.5" fill="url(#leafGradient)">eat</text>
</svg>
