<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Fallback-title för rutter utan <Seo> (t.ex. /login, /app/*).
      description/og/canonical sätts per sida via react-helmet-async i <Seo> —
      lägg ALDRIG tillbaka dem statiskt här: Helmet äger bara sina egna taggar,
      så statiska dubbletter följer med i prerendrad HTML och förvirrar crawlers.
    -->
    <title>Calculeat — Kalorikalkylator och matloggning</title>
    <!-- Sajtvid Organization + WebSite. Article-schemats publisher pekar på
         @id nedan — håll dem i synk med src/lib/seo/constants.ts -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://calculeat.com/#organization",
            "name": "Calculeat",
            "url": "https://calculeat.com",
            "logo": {
              "@type": "ImageObject",
              "url": "https://calculeat.com/logo-512.png"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://calculeat.com/#website",
            "name": "Calculeat",
            "url": "https://calculeat.com",
            "publisher": { "@id": "https://calculeat.com/#organization" },
            "inLanguage": "sv-SE"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
