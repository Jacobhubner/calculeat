<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon-180x180.png" />
    <link rel="apple-touch-icon" sizes="152x152" href="/apple-touch-icon-152x152.png" />
    <link rel="apple-touch-icon" sizes="120x120" href="/apple-touch-icon-120x120.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <meta name="theme-color" content="#7ABC29" />
    <!--
      Fallback-title för rutter utan <Seo> (t.ex. /login, /app/*).
      description/og/canonical sätts per sida via react-helmet-async i <Seo> —
      lägg ALDRIG tillbaka dem statiskt här: Helmet äger bara sina egna taggar,
      så statiska dubbletter följer med i prerendrad HTML och förvirrar crawlers.
    -->
    <title>Calculeat — Kalorikalkylator och matloggning</title>
    <!-- Sajtvid Organization + WebSite. Article-schemats publisher pekar på
         @id nedan — håll dem i synk med src/lib/seo/constants.ts -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "Organization",
            "@id": "https://calculeat.com/#organization",
            "name": "Calculeat",
            "url": "https://calculeat.com",
            "logo": {
              "@type": "ImageObject",
              "url": "https://calculeat.com/calculeat-logo-512.png"
            }
          },
          {
            "@type": "WebSite",
            "@id": "https://calculeat.com/#website",
            "name": "Calculeat",
            "url": "https://calculeat.com",
            "publisher": { "@id": "https://calculeat.com/#organization" },
            "inLanguage": "sv-SE"
          }
        ]
      }
    </script>

    <!--
      Sätter temaklassen innan React monterar. Utan detta hinner sidan måla
      upp sig ljus och blinka till mörk när storen läser in sitt sparade val.
      Håll logiken i synk med src/stores/themeStore.ts.
    -->
    <script>
      ;(function () {
        try {
          var stored = localStorage.getItem('calculeat-theme')
          var preference = stored ? JSON.parse(stored).state.preference : 'system'
          var dark =
            preference === 'dark' ||
            (preference === 'system' &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.toggle('dark', dark)
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        } catch (e) {
          /* Blockerad localStorage eller trasigt värde — ljust läge duger. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
